{% extends "base.html" %}

{% block title %}Rate Your Startup Idea{% endblock %}

{% block content %}
<section class="form-section">
    <a href="/" class="btn">Back</a>
    <h2>Startup Evaluation Form</h2>

    <form action="/submit" method="POST">

        <!-- Founder Info -->
        <input type="text" name="name" placeholder="Founder Name *" required>
        <input type="email" name="email" placeholder="Founder Email *" required>
        <input type="tel" name="phone" placeholder="Phone Number">

        <!-- Industry -->
        <select name="industry" id="industry-select" required>
            <option value="" disabled selected>Select Industry *</option>
            <option value="SaaS">SaaS</option>
            <option value="B2B Marketplace">B2B Marketplace</option>
            <option value="B2C Marketplace">B2C Marketplace</option>
            <option value="Fintech">Fintech</option>
            <option value="Edtech">Edtech</option>
            <option value="Healthtech">Healthtech</option>
            <option value="E-commerce / D2C">E-commerce / D2C</option>
            <option value="AI / ML">AI / ML</option>
            <option value="Logistics / Supply Chain">Logistics / Supply Chain</option>
            <option value="Agritech">Agritech</option>
            <option value="Proptech">Proptech</option>
            <option value="Deeptech">Deeptech</option>
            <option value="Consumer Apps">Consumer Apps</option>
            <option value="Gaming">Gaming</option>
            <option value="Web3 / Blockchain">Web3 / Blockchain</option>
            <option value="Climate Tech">Climate Tech</option>
            <option value="Other">Other</option>
        </select>
        <input type="text" name="industry_other" id="industry-other"
               placeholder="Please specify industry"
               style="display:none; margin-top:0.5rem;">

        <!-- Product -->
        <input type="text" name="product_service" placeholder="Product / Service *" required>

        <!-- Problem -->
        <textarea name="problem_statement"
            placeholder="What problem are you solving? Who faces it and how often?"></textarea>

        <!-- Target Customers -->
        <input type="text" name="target_customers"
               placeholder="Target Customers (e.g. SMBs, Students, Enterprises) *" required>

        <!-- Differentiation -->
        <textarea name="differentiation"
            placeholder="How is your product different from existing solutions?"></textarea>

        <!-- Pricing -->
        <input type="text" name="pricing_model"
               placeholder="Pricing Model (e.g. $29/month, per user, commission, freemium) *" required>

        <!-- Stage -->
        <select name="stage" id="stage-select" required>
            <option value="" disabled selected>Select Stage *</option>
            <option value="Idea">Idea</option>
            <option value="MVP">MVP</option>
            <option value="Early Revenue">Early Revenue</option>
            <option value="Scaling">Scaling</option>
            <option value="Other">Other</option>
        </select>
        <input type="text" name="stage_other" id="stage-other"
               placeholder="Please specify stage"
               style="display:none; margin-top:0.5rem;">

        <!-- Team Size -->
        <label>Team Size *</label>
        <div class="radio-group">
            <label><input type="radio" name="team_size" value="1-3" required> 1–3</label>
            <label><input type="radio" name="team_size" value="3-10"> 3–10</label>
            <label><input type="radio" name="team_size" value="10-50"> 10–50</label>
            <label><input type="radio" name="team_size" value="50+"> 50+</label>
            <label><input type="radio" name="team_size" value="Other"> Other</label>
        </div>
        <input type="text" name="team_size_other" id="team-size-other"
               placeholder="Please specify team size"
               style="display:none; margin-top:0.5rem;">

        <!-- Revenue -->
        <input type="number" name="current_revenue"
               placeholder="Current Monthly Revenue (USD) *"
               min="0" step="any" required>

        <!-- Market -->
        <input type="text" name="country"
               placeholder="Country / Primary Market *" required>

        <!-- Competitors -->
        <textarea name="competitors"
            placeholder="Known competitors (optional)"></textarea>

        <!-- Validation -->
        <textarea name="validation"
            placeholder="What proof do you have that users want this? (users, revenue, pilots, waitlist)"></textarea>

        <!-- Willingness to Pay -->
        <label for="willingness_to_pay">Customer Willingness to Pay *</label>
        <select name="willingness_to_pay" id="willingness-to-pay-select" required>
            <option value="" disabled selected>Select an option</option>
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
            <option value="Unsure">Unsure</option>
            <option value="Other">Other</option>
        </select>
        <input type="text" name="willingness_to_pay_other" id="willingness-to-pay-other"
               placeholder="Please specify willingness to pay"
               style="display:none; margin-top:0.5rem;">
        <small class="helper-text">
            Based on your understanding of customer behavior.
        </small>

        <button type="submit">Submit</button>
    </form>
</section>

<script>
    // Industry "Other"
    const industrySelect = document.getElementById('industry-select');
    const industryOther = document.getElementById('industry-other');
    industrySelect.addEventListener('change', function () {
        if (this.value === 'Other') {
            industryOther.style.display = 'block';
            industryOther.required = true;
        } else {
            industryOther.style.display = 'none';
            industryOther.required = false;
            industryOther.value = '';
        }
    });

    // Stage "Other"
    const stageSelect = document.getElementById('stage-select');
    const stageOther = document.getElementById('stage-other');
    stageSelect.addEventListener('change', function () {
        if (this.value === 'Other') {
            stageOther.style.display = 'block';
            stageOther.required = true;
        } else {
            stageOther.style.display = 'none';
            stageOther.required = false;
            stageOther.value = '';
        }
    });

    // Team Size "Other"
    const teamRadios = document.getElementsByName('team_size');
    const teamOther = document.getElementById('team-size-other');
    teamRadios.forEach(radio => {
        radio.addEventListener('change', function() {
            if (this.value === 'Other') {
                teamOther.style.display = 'block';
                teamOther.required = true;
            } else {
                teamOther.style.display = 'none';
                teamOther.required = false;
                teamOther.value = '';
            }
        });
    });

    // Willingness to Pay "Other"
    const paySelect = document.getElementById('willingness-to-pay-select');
    const payOther = document.getElementById('willingness-to-pay-other');
    paySelect.addEventListener('change', function () {
        if (this.value === 'Other') {
            payOther.style.display = 'block';
            payOther.required = true;
        } else {
            payOther.style.display = 'none';
            payOther.required = false;
            payOther.value = '';
        }
    });
</script>
{% endblock %}
